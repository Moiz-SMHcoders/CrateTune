<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 512 512">
  <!-- CrateTune app icon (original artwork, GPL-3.0 like the rest of the project).
       A white katakana ク ("ku", as in クレート, "crate") in chunky, slightly tilted
       strokes on a deep navy rounded tile. Rendered to .icns / .ico / PNG by
       scripts/make-icons.sh. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22436A"/>
      <stop offset="1" stop-color="#0F2238"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect x="40" y="40" width="432" height="432" rx="104" fill="url(#tile)" filter="url(#shadow)"/>
  <g fill="#F2F5FA">
    <path d="M204 116 L256 126 L190 262 L140 242 Z"/>
    <path d="M212 176 L384 158 L274 404 L224 382 L300 214 L206 224 Z"/>
  </g>
</svg>
