<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- App icon (original artwork, GPL-3.0 like the rest of the project).
       A rounded square with a violet-to-coral gradient and five white level bars.
       Rendered to .icns / .ico / PNG by scripts/make-icons.sh. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3B2CF5"/>
      <stop offset="0.55" stop-color="#9A2CEB"/>
      <stop offset="1" stop-color="#FF5A78"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.20"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#1A0B4D" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)"/>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#shine)"/>
  <g fill="#FFFFFF" filter="url(#shadow)">
    <rect x="272" y="422" width="64" height="180" rx="32"/>
    <rect x="376" y="342" width="64" height="340" rx="32"/>
    <rect x="480" y="262" width="64" height="500" rx="32"/>
    <rect x="584" y="362" width="64" height="300" rx="32"/>
    <rect x="688" y="412" width="64" height="200" rx="32"/>
  </g>
</svg>
