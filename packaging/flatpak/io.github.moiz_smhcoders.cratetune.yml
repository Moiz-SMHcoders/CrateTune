# Generated by scripts/update-packages.sh for v0.2.6; edit the script, not this file.
#
# Repackages the release's Linux tarball (the binary CI builds and tests on Ubuntu 22.04
# with the pinned Rust toolchain) instead of compiling: see docs/RELEASING.md, "Flatpak".
# Build and install locally:
#   flatpak-builder --user --install --force-clean build-dir io.github.moiz_smhcoders.cratetune.yml
app-id: io.github.moiz_smhcoders.cratetune
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: cratetune

finish-args:
  - --share=network
  - --share=ipc
  # GPUI draws with Vulkan: Wayland first, X11 only where there is no Wayland.
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  # Playback, and the microphone for song recognition (PipeWire answers PulseAudio).
  - --socket=pulseaudio
  # Media keys and the desktop's media controls.
  - --own-name=org.mpris.MediaPlayer2.cratetune
  # Sign-ins and API keys in the keyring (Secret Service).
  - --talk-name=org.freedesktop.secrets
  # Discord Rich Presence talks to the Discord app's IPC socket (native or Flatpak).
  - --filesystem=xdg-run/discord-ipc-0
  - --filesystem=xdg-run/app/com.discordapp.Discord:create
  # Exports and backups default to Downloads; other files go through the file chooser
  # portal. Local files are read from Music.
  - --filesystem=xdg-download
  - --filesystem=xdg-music:ro
  # Turns the in-app updater off: Flatpak updates the app (FLATPAK_ID says so too).
  - --env=CRATETUNE_PACKAGED=flatpak

modules:
  - name: cratetune
    buildsystem: simple
    only-arches:
      - x86_64
    build-commands:
      - install -Dm755 bin/cratetune /app/bin/cratetune
      - |
        for icon in share/icons/hicolor/*/apps/cratetune.png; do
          size="$(basename "$(dirname "$(dirname "$icon")")")"
          install -Dm644 "$icon" "/app/share/icons/hicolor/$size/apps/io.github.moiz_smhcoders.cratetune.png"
        done
      - install -Dm644 io.github.moiz_smhcoders.cratetune.desktop -t /app/share/applications
      - install -Dm644 io.github.moiz_smhcoders.cratetune.metainfo.xml -t /app/share/metainfo
      - install -Dm644 LICENSE -t /app/share/licenses/io.github.moiz_smhcoders.cratetune
    sources:
      - type: archive
        url: https://github.com/Moiz-SMHcoders/CrateTune/releases/download/v0.2.6/cratetune-0.2.6-linux-x86_64.tar.gz
        sha256: be43249b6a9bca5d115d06ff8f20c8f10c96a1539a911065435ab1f7fd04807e
        x-checker-data:
          type: json
          url: https://api.github.com/repos/Moiz-SMHcoders/CrateTune/releases/latest
          version-query: '.tag_name | sub("^v"; "")'
          url-query: '"https://github.com/Moiz-SMHcoders/CrateTune/releases/download/v" + $version + "/cratetune-" + $version + "-linux-x86_64.tar.gz"'
      - type: file
        path: io.github.moiz_smhcoders.cratetune.desktop
      - type: file
        path: io.github.moiz_smhcoders.cratetune.metainfo.xml
