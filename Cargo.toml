[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["vendor"]

[workspace.package]
edition = "2024"
version = "0.2.6"

# Patched copy of opus-decoder 0.1.1: FFT-based inverse MDCT and no leftover debug-log
# file opens (vendor/opus-decoder/VENDORED.md).
[patch.crates-io]
opus-decoder = { path = "vendor/opus-decoder" }

[profile.release]
opt-level = 3
lto = "thin"
strip = "symbols"

# opus-decoder's CELT code has shifts that overflow on some real streams (harmless
# wrapping in release builds, where overflow checks are off); keep dev builds from
# panicking on YouTube's Opus formats, and fast enough to decode in real time.
[profile.dev.package.opus-decoder]
overflow-checks = false
opt-level = 3
