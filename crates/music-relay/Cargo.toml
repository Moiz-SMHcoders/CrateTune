[package]
name = "music-relay"
edition.workspace = true
version.workspace = true
license = "GPL-3.0-only"
description = "Self-hostable relay server for Music Together sessions across networks"

[dependencies]
music-net = { path = "../music-net" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tungstenite = { version = "0.28", default-features = false, features = ["handshake"] }

[dev-dependencies]
# The end-to-end test runs a real host and guests against the relay.
music-core = { path = "../music-core", default-features = false }
