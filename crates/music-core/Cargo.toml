[package]
name = "music-core"
edition.workspace = true
version.workspace = true
license = "GPL-3.0-only"
description = "UI-agnostic YouTube Music backend + audio engine shared by every UI spike"

[dependencies]
base64 = "0.22"
# BLAKE2b-512 prehash of minisign signatures (the signed player-fixes manifest, `youtube::fixes`).
blake2 = "0.10"
crc32fast = "1.5"
deunicode = "1.6"
discord-rich-presence = { version = "1", optional = true }
# Japanese tokenizer for kanji readings; the dictionary is downloaded at runtime
# (`lyrics::romanize::dictionary`) unless `japanese-dict` embeds it.
lindera = "6.2"
# NFKD normalization for the module track matcher (already in the graph via url/idna).
icu_normalizer = "2"
lofty = "0.25"
log = "0.4.34"
md5 = "0.8"
pinyin = { version = "0.11", default-features = false, features = ["with_tone"] }
regex = "1.13"
# Ed25519 for the player-fixes manifest signature, AES-256-GCM for browser cookies on Windows
# (already in the graph through rustls).
ring = "0.17"
roxmltree = "0.21"
rodio = { version = "0.23", default-features = false, features = ["playback"] }
# QuickJS for provider modules (`modules`): sandboxed, no async runtime, no cmake.
rquickjs = { version = "0.14", features = ["allocator"] }
rusqlite = { version = "0.41", features = ["bundled", "backup"] }
# FFT for the spectrum analyzer (`spectrum`); already in the graph through symphonia-core.
rustfft = "6.4"
serde = { version = "1.0.229", features = ["derive", "rc"] }
serde_json = "1.0.154"
sha1_smol = "1"
symphonia = { version = "0.6", default-features = false, features = [
    "opt-simd",
    # codecs
    "aac",
    "alac",
    "flac",
    "mp3",
    "pcm",
    "vorbis",
    # containers
    "aiff",
    "isomp4",
    "mkv",
    "ogg",
    "wav",
    # tags (ID3v1/v2, APE) for ReplayGain on local files
    "all-meta",
] }
# Pure-Rust Opus decoder (no FFI, no cmake); Symphonia 0.6 has no Opus codec of its own.
opus-decoder = "0.1"
# Pure-Rust port of Sonic (speed/pitch), the same algorithm ExoPlayer uses.
libsonic = "0.1"
thiserror = "2"
# Integrations (SponsorBlock hash prefixes, Spotify PKCE, Together sessions, playlist import).
csv = "1"
getrandom = "0.3"
sha2 = "0.10"
# Music Together: blocking WebSockets over std TCP on worker threads (no async runtime).
tungstenite = { version = "0.28", default-features = false, features = ["handshake"] }
music-net = { path = "../music-net" }
# `wss://` relays for Music Together and the Cast channel (TLS 1.2+ on port 8009):
# the rustls + ring + Mozilla roots already in the graph through ureq.
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "ring"] }
webpki-roots = "1"
# Chromecast discovery (`cast`): mDNS-SD on std threads (no async runtime).
mdns-sd = { version = "0.21", default-features = false }
# Importing the YouTube cookies of an installed browser (`browser_cookies`): Chromium's
# AES-128-CBC (macOS / Linux, key by PBKDF2-HMAC-SHA1) and AES-256-GCM (Windows, ring).
# All already in the graph (zip, rustls).
aes = "0.8"
cbc = "0.1"
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
sha1 = "0.10"
unicode-normalization = "0.1"
ureq = { version = "3", features = ["json", "socks-proxy"] }
url = "2.5"
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }
# Device hand-off (`handoff`): peer-to-peer QUIC between paired installations, our own
# relay only (no n0 relays or DNS), mDNS on the LAN. iroh runs on its own thread with a
# single-threaded tokio runtime (tokio is already in the graph).
iroh = { version = "=1.4.1", default-features = false, features = ["tls-ring", "portmapper", "fast-apple-datapath"] }
iroh-mdns-address-lookup = "=0.6.1"
# Pairing by a short code: SPAKE2 (password-authenticated key exchange), so the code can't be
# brute-forced offline; shares iroh's curve25519-dalek 5.
spake2 = { version = "=0.5.0-pre.0", features = ["getrandom"] }
tokio = { version = "1.54", default-features = false, features = ["rt", "sync", "time", "macros"] }
# `StreamExt::next` for iroh's mDNS events (already in the graph).
futures-util = { version = "0.3", default-features = false, features = ["std"] }

[features]
default = ["media-controls", "discord", "webkit-potoken", "webview2-potoken", "video"]
# Music videos in Now Playing (`video`): H.264 through VideoToolbox on macOS, Media
# Foundation on Windows (both part of the OS), OpenH264 compiled in on Linux.
video = [
    "dep:objc2-core-foundation",
    "dep:objc2-core-media",
    "dep:objc2-core-video",
    "dep:objc2-video-toolbox",
    "dep:windows",
    "dep:openh264",
]
# PoTokens for the web stream client via BotGuard in a hidden WKWebView (macOS only;
# a no-op elsewhere).
webkit-potoken = [
    "dep:block2",
    "dep:dispatch2",
    "dep:objc2",
    "dep:objc2-core-foundation",
    "dep:objc2-foundation",
    "dep:objc2-web-kit",
]
# PoTokens via BotGuard in a hidden WebView2 (Windows only; a no-op elsewhere). Uses
# the WebView2 runtime that ships with Windows 10/11 (the loader is linked statically
# with MSVC). Untested on Windows.
webview2-potoken = ["dep:webview2-com", "dep:windows"]
# PoTokens via BotGuard in WebKitGTK (Linux only; off by default): needs
# libwebkit2gtk-4.1-dev (>= 2.40) to build and libwebkit2gtk-4.1 to run. Untested.
webkitgtk-potoken = ["dep:webkit2gtk", "dep:gtk", "dep:javascriptcore-rs"]
# Embeds IPADIC for kanji readings (no runtime download needed). Off by default:
# adds ~48 MB to the binary and downloads the dictionary (~13 MB) at build time.
# Without it the app downloads the same dictionary on demand (10.5 MB, see
# `lyrics::romanize::dictionary`).
japanese-dict = ["lindera/embed-ipadic"]
# Discord Rich Presence (`discord` module).
discord = ["dep:discord-rich-presence"]
# OS media controls (`media_controls` module): MediaPlayer on macOS, SMTC on Windows, MPRIS on Linux.
media-controls = [
    "dep:block2",
    "dep:objc2",
    "dep:objc2-app-kit",
    "dep:objc2-core-foundation",
    "dep:objc2-foundation",
    "dep:objc2-media-player",
    "dep:windows",
    "dep:windows-future",
    "dep:mpris-server",
]

[target.'cfg(unix)'.dependencies]
# Background QoS / nice and thread CPU time for the waveform worker (`waveform`).
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = { version = "0.6", optional = true }
objc2 = { version = "0.6", optional = true }
objc2-app-kit = { version = "0.3", optional = true, default-features = false, features = ["std", "NSImage"] }
objc2-core-foundation = { version = "0.3", optional = true, default-features = false, features = ["std", "CFCGTypes", "CFDictionary", "CFNumber", "CFString"] }
objc2-core-media = { version = "0.3.2", optional = true, default-features = false, features = ["std", "CMBase", "CMBlockBuffer", "CMFormatDescription", "CMSampleBuffer", "CMTime"] }
objc2-core-video = { version = "0.3.2", optional = true, default-features = false, features = ["std", "CVBuffer", "CVImageBuffer", "CVPixelBuffer", "CVReturn"] }
objc2-video-toolbox = { version = "0.3.2", optional = true, default-features = false, features = ["std", "VTBase", "VTDecompressionSession", "VTErrors", "objc2-core-media", "objc2-core-video"] }
objc2-foundation = { version = "0.3", optional = true, default-features = false, features = ["std", "NSData", "NSDictionary", "NSError", "NSGeometry", "NSString", "NSURL", "NSValue"] }
dispatch2 = { version = "0.3", optional = true }
objc2-web-kit = { version = "0.3.2", optional = true, default-features = false, features = [
    "std",
    "block2",
    "objc2-app-kit",
    "objc2-core-foundation",
    "WKContentWorld",
    "WKFrameInfo",
    "WKNavigation",
    "WKWebView",
    "WKWebViewConfiguration",
] }
objc2-media-player = { version = "0.3", optional = true, default-features = false, features = [
    "std",
    "block2",
    "objc2-app-kit",
    "objc2-core-foundation",
    "MPMediaItem",
    "MPNowPlayingInfoCenter",
    "MPRemoteCommand",
    "MPRemoteCommandCenter",
    "MPRemoteCommandEvent",
] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", optional = true, features = [
    "Foundation",
    "Media",
    "Storage_Streams",
    "Win32_Foundation",
    "Win32_System_WinRT",
    # webview2-potoken
    "Win32_System_Com",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    # video: the H.264 decoder of Media Foundation
    "Win32_Media_MediaFoundation",
] }
webview2-com = { version = "0.39", optional = true }
windows-future = { version = "0.3", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
mpris-server = { version = "0.10", optional = true }
# video: H.264 decoding (Cisco's OpenH264, BSD-2-Clause, built from its source; no
# system library needed).
openh264 = { version = "0.9", optional = true }
webkit2gtk = { version = "2.0", optional = true, features = ["v2_40"] }
gtk = { version = "0.18", optional = true }
javascriptcore-rs = { version = "1.1", optional = true }

[target.'cfg(target_os = "macos")'.dev-dependencies]
# The `youtube` example runs the main run loop for the PoToken web view.
objc2-core-foundation = { version = "0.3", features = ["CFRunLoop"] }
