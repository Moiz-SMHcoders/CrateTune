[package]
name = "music-gpui"
edition.workspace = true
version.workspace = true
license = "GPL-3.0-only"
description = "Native YouTube Music client on GPUI + gpui-component"

[dependencies]
music-core = { path = "../music-core" }
# gpui-component 0.8.1 pins this exact GPUI snapshot (published as `gpui-pre`).
gpui = { package = "gpui-pre", version = "=0.3.10" }
# Native platform backends; `runtime_shaders` avoids needing `xcrun metal` (full Xcode) at build time.
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.10", default-features = false, features = ["font-kit", "runtime_shaders", "wayland", "x11"] }
gpui-component = "=0.8.1"
gpui-kit-assets = "=0.8.1"
# oneshot channel for work run on dedicated threads (already in GPUI's graph).
futures-channel = "0.3"
# Decoding + blurring the Now Playing background (GPUI already links image 0.25 with these codecs).
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
# Settings file (serde/serde_json are already in GPUI's graph) in the platform config dir.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "6"
# Secrets in the OS keychain (macOS Keychain, Windows Credential Manager, Secret Service).
keyring = "4.2"

[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
# Native handles of GPUI windows: the HWND for the SMTC media controls (Windows),
# the NSWindow of the mini player (macOS).
raw-window-handle = "0.6"

[target.'cfg(target_os = "macos")'.dependencies]
# One AppKit call (`setHidesOnDeactivate:` on the mini player panel); already in GPUI's graph.
objc2 = "0.6"
# Menu-bar (status item) icon with playback controls; works alongside GPUI's NSApplication.
tray-icon = { version = "0.26", default-features = false }
# YouTube Music sign-in window: a WKWebView child of a GPUI window (wry), and its cookie
# store read directly (wry's `cookies()` spins the run loop, re-entering GPUI).
wry = { version = "0.57", default-features = false }
objc2-web-kit = { version = "0.3.2", default-features = false, features = ["std", "objc2-app-kit", "block2", "WKWebView", "WKWebViewConfiguration", "WKWebsiteDataStore", "WKHTTPCookieStore"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSHTTPCookie", "NSString", "NSURL"] }
block2 = "0.6"

[features]
# Dev-only offscreen screenshot hook (needs GPUI's test-support for `Window::render_to_image`).
screenshot = ["gpui/test-support", "gpui_platform/test-support"]
