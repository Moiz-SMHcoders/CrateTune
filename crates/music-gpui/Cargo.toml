[package]
name = "music-gpui"
edition.workspace = true
version.workspace = true
description = "YouTube Music spike UI on GPUI + gpui-component"

[dependencies]
music-core = { path = "../music-core" }
# gpui-component 0.8.1 pins this exact GPUI snapshot (published as `gpui-pre`).
gpui = { package = "gpui-pre", version = "=0.3.10" }
# Native platform backends; `runtime_shaders` avoids needing `xcrun metal` (full Xcode) at build time.
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.10", default-features = false, features = ["font-kit", "runtime_shaders", "wayland", "x11"] }
gpui-component = "=0.8.1"
gpui-kit-assets = "=0.8.1"
image = { version = "0.25", optional = true, default-features = false, features = ["png"] }

[features]
# Dev-only offscreen screenshot hook (needs GPUI's test-support for `Window::render_to_image`).
screenshot = ["gpui/test-support", "gpui_platform/test-support", "dep:image"]
