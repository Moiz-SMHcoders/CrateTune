[package]
name = "music-gpui"
edition.workspace = true
version.workspace = true
license = "GPL-3.0-only"
description = "Native YouTube Music client on GPUI + gpui-component"

[dependencies]
music-core = { path = "../music-core" }
# gpui-component 0.8.1 pins this exact GPUI snapshot (published as `gpui-pre`).
gpui = { package = "gpui-pre", version = "=0.3.10" }
# Native platform backends; `runtime_shaders` avoids needing `xcrun metal` (full Xcode) at build time.
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.10", default-features = false, features = ["font-kit", "runtime_shaders", "wayland", "x11"] }
gpui-component = "=0.8.1"
gpui-kit-assets = "=0.8.1"
# oneshot channel for work run on dedicated threads (already in GPUI's graph).
futures-channel = "0.3"
# `StreamExt::next` for channels read on the main thread (already in GPUI's graph).
futures-util = { version = "0.3", default-features = false, features = ["std"] }
# Decoding + blurring the Now Playing background (GPUI already links image 0.25 with these codecs).
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
# Lyrics cards: text (rustybuzz shaping, system-font fallback) + drawing; already
# in GPUI's graph with these features (no new crates).
resvg = { version = "0.46", default-features = false, features = ["text", "system-fonts", "memmap-fonts"] }
# Settings file (serde/serde_json are already in GPUI's graph) in the platform config dir.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "6"
# Secrets in the OS keychain (macOS Keychain, Windows Credential Manager, Secret Service).
keyring = "4.2"
# The system's preferred UI languages (already in GPUI's graph through parley).
sys-locale = "0.3"

[target.'cfg(windows)'.build-dependencies]
# Icon + version info in the .exe (`build.rs`, `packaging/windows/app.rc`); already a
# build dependency of GPUI on Windows.
embed-resource = "3"

[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
# Native handles of GPUI windows: the HWND for the SMTC media controls (Windows),
# the NSWindow of the mini player (macOS).
raw-window-handle = "0.6"

[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies.tray-icon]
# Menu-bar (status item) icon on macOS, notification-area icon on Windows, with playback
# controls; driven by GPUI's own event loop on both.
version = "0.26"
default-features = false

[target.'cfg(target_os = "windows")'.dependencies]
# Win32 bits (all already in GPUI's graph): the WebView2 sign-in window on its own
# thread, the single-instance mutex, the console for `MUSIC_CONSOLE`, the mini player's
# always-on-top style, the system "animate controls" setting.
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    # DPAPI: the cookie key of Chromium browsers ("Sign in from your browser").
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
webview2-com = "0.39"

[target.'cfg(target_os = "macos")'.dependencies]
# One AppKit call (`setHidesOnDeactivate:` on the mini player panel); already in GPUI's graph.
objc2 = "0.6"
# YouTube Music sign-in window: a WKWebView child of a GPUI window (wry), and its cookie
# store read directly (wry's `cookies()` spins the run loop, re-entering GPUI).
wry = { version = "0.57", default-features = false }
# Background session renewal: a WKWebView on the persistent sign-in store, never in a window.
objc2-web-kit = { version = "0.3.2", default-features = false, features = ["std", "objc2-app-kit", "objc2-core-foundation", "block2", "WKNavigation", "WKWebView", "WKWebViewConfiguration", "WKWebsiteDataStore", "WKHTTPCookieStore"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSDate", "NSError", "NSHTTPCookie", "NSProcessInfo", "NSSet", "NSString", "NSURL", "NSURLRequest", "NSUUID"] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFCGTypes"] }
block2 = "0.6"

[features]
# Dev-only offscreen screenshot hook (needs GPUI's test-support for `Window::render_to_image`).
screenshot = ["gpui/test-support", "gpui_platform/test-support"]
