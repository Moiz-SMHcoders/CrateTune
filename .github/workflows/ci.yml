# Format, lint and test on macOS, Linux and Windows.
name: CI

on:
  push:
    branches: [main, "ci/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # Tests open no audio device / keychain unless asked; keep secrets in the settings file.
  MUSIC_SECRET_STORE: file

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99"
          components: rustfmt
      - run: cargo fmt --all --check

  check:
    name: clippy + test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux packages (GPUI, ALSA, fonts)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config clang \
            libasound2-dev libfontconfig-dev libfreetype-dev \
            libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libx11-dev libx11-xcb-dev libxcb1-dev libxcb-xfixes0-dev libxcb-shape0-dev libxcb-randr0-dev \
            libvulkan-dev libdbus-1-dev libssl-dev libzstd-dev

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99"
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-${{ matrix.os }}

      - name: clippy
        shell: bash
        run: scripts/ci-run.sh cargo clippy --workspace --all-targets -- -D warnings

      - name: clippy (screenshot feature)
        shell: bash
        run: scripts/ci-run.sh cargo clippy -p music-gpui --features screenshot -- -D warnings

      - name: test
        shell: bash
        # Release: the engine tests play audio against the clock, too slow unoptimized
        # on the hosted runners.
        run: scripts/ci-run.sh cargo test --workspace --release

      # Offline Home (InnerTube fixtures), full window draws at the top and at the end
      # of a long feed: fails if a frame costs more the further the page is scrolled,
      # or exceeds a ceiling for these runners (docs/TESTING.md, "Frame-time check").
      # Linux runners have no display or GPU; skipped there.
      - name: "perf: frame-time"
        if: runner.os != 'Linux'
        shell: bash
        run: scripts/perf-frames.sh --max-ms ${{ runner.os == 'Windows' && '20' || '15' }}

      # TEMPORARY (calibration on ci/perf-checks): repeat the check, and once without
      # culling, to see the spread on these runners. Removed before merging.
      - name: "perf: calibration (temporary)"
        if: runner.os != 'Linux' && always()
        continue-on-error: true
        shell: bash
        run: |
          exe=target/release/music-gpui; [ "$RUNNER_OS" = Windows ] && exe=$exe.exe
          for i in 1 2 3 4; do scripts/perf-frames.sh --binary $exe --max-ms 1000 | grep -E '^\| (top|end)|^- ' || true; done
          for i in 1 2; do MUSIC_NO_CULL=1 scripts/perf-frames.sh --binary $exe --max-ms 1000 | grep -E '^\| (top|end)|^- ' || true; done
