# Format, lint and test on macOS, Linux and Windows.
name: CI

on:
  push:
    branches: [main, "ci/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # Tests open no audio device / keychain unless asked; keep secrets in the settings file.
  MUSIC_SECRET_STORE: file

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99"
          components: rustfmt
      - run: cargo fmt --all --check

  check:
    name: clippy + test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux packages (GPUI, ALSA, fonts)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config clang \
            libasound2-dev libfontconfig-dev libfreetype-dev \
            libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libx11-dev libx11-xcb-dev libxcb1-dev libxcb-xfixes0-dev libxcb-shape0-dev libxcb-randr0-dev \
            libvulkan-dev libdbus-1-dev libssl-dev libzstd-dev

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99"
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-${{ matrix.os }}

      - name: clippy
        shell: bash
        run: scripts/ci-run.sh cargo clippy --workspace --all-targets -- -D warnings

      - name: clippy (screenshot feature)
        shell: bash
        run: scripts/ci-run.sh cargo clippy -p music-gpui --features screenshot -- -D warnings

      - name: test
        shell: bash
        # Release: the engine tests play audio against the clock, too slow unoptimized
        # on the hosted runners.
        run: scripts/ci-run.sh cargo test --workspace --release

      # Linux runners have no display or GPU: a virtual X server, and Mesa's software
      # Vulkan (lavapipe) / OpenGL for GPUI's wgpu renderer.
      - name: "perf: Linux display (Xvfb, Mesa)"
        if: ${{ !cancelled() && runner.os == 'Linux' }}
        run: |
          sudo apt-get install -y --no-install-recommends xvfb mesa-vulkan-drivers libgl1-mesa-dri libegl1
          # Runs until the job ends.
          Xvfb :99 -screen 0 1920x1080x24 -nolisten tcp &
          echo "DISPLAY=:99" >> "$GITHUB_ENV"

      # Offline Home (InnerTube fixtures), full window draws near the top and at the end
      # of a long feed: fails if a frame costs more the further the page is scrolled,
      # or exceeds a ceiling for these runners (docs/TESTING.md, 6.3). Logs the app's
      # memory after each bench (footprint / private bytes / resident set).
      - name: "perf: frame-time"
        # Also when a test failed: a separate question, and its numbers still count.
        if: ${{ !cancelled() }}
        shell: bash
        run: scripts/perf-frames.sh --max-ms 30

      # The same with every feed page bringing its own artwork (~700 images, past the
      # artwork memory budget), as a long session on a real feed.
      - name: "perf: frame-time, artwork past the cache budget"
        if: ${{ !cancelled() }}
        shell: bash
        run: scripts/perf-frames.sh --max-ms 30 --page-art
