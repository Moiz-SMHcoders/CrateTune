# Builds release artifacts for every OS when a version tag (v1.2.3) is pushed and
# attaches them to a draft GitHub release. Signing/notarization secrets are optional:
#   MACOS_SIGN_IDENTITY (+ a keychain with the Developer ID certificate) for macOS.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            os: macos-14
          - name: macos-x86_64
            # The last Intel runner image (macos-13 was retired in December 2025).
            os: macos-15-intel
          - name: linux-x86_64
            os: ubuntu-22.04
          - name: windows-x64
            os: windows-2022
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config clang \
            libasound2-dev libfontconfig-dev libfreetype-dev \
            libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libx11-dev libx11-xcb-dev libxcb1-dev libxcb-xfixes0-dev libxcb-shape0-dev libxcb-randr0-dev \
            libvulkan-dev libdbus-1-dev libssl-dev libzstd-dev libfuse2 file
          curl -fsSL -o /usr/local/bin/appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x /usr/local/bin/appimagetool

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99"

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-${{ matrix.name }}

      - name: Bundle (macOS)
        if: runner.os == 'macOS'
        env:
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
        run: scripts/bundle-macos.sh

      - name: Bundle (Linux)
        if: runner.os == 'Linux'
        run: scripts/bundle-linux.sh --appimage

      - name: Bundle (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: scripts/bundle-windows.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            target/bundle/*.dmg
            target/bundle/*.tar.gz
            target/bundle/*.AppImage
            target/bundle/*.zip
            target/bundle/*-setup.exe
          if-no-files-found: error

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" --draft --title "$GITHUB_REF_NAME" --generate-notes
